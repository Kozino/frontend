<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ESG Reports - Qatar SME Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .report-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        .report-card:hover {
            transform: translateX(5px);
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .report-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark);
        }
        .report-date {
            color: #7f8c8d;
            font-size: 13px;
        }
        .report-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .year-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .year-selector select {
            width: auto;
            min-width: 150px;
        }
        .report-preview {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }
        .badge-pending {
            background: #f39c12;
            color: white;
        }
        .badge-completed {
            background: #27ae60;
            color: white;
        }
        @media (max-width: 768px) {
            .report-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .report-actions {
                width: 100%;
            }
            .btn-sm {
                flex: 1;
                text-align: center;
            }
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: white;
            border-radius: 12px;
        }
        .search-box {
            flex: 1;
            max-width: 300px;
        }
        .search-box input {
            margin: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="logo">🌿 ESG Qatar SME</a>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="esg-form.html">Enter ESG Data</a>
                <a href="reports.html" class="active">Reports</a>
                <a href="materiality.html">Materiality</a>
                <a href="#" id="logoutBtn">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>📄 ESG Reports</h1>
        <p>Generate and download ESG reports aligned with QDB guidelines (Pages 16-28)</p>

        <!-- Generate New Report Section -->
        <div class="card">
            <h3>📊 Generate New Report</h3>
            <div class="year-selector">
                <div class="form-group" style="margin-bottom: 0; flex: 1;">
                    <label>Select Year</label>
                    <select id="reportYear">
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0; flex: 1;">
                    <label>Report Type</label>
                    <select id="reportType">
                        <option value="basic">Basic Report (Pages 16-28)</option>
                        <option value="advanced">Advanced Report (Pages 29-32)</option>
                        <option value="sector">Sector-Specific Report</option>
                    </select>
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button id="generateReportBtn" class="btn btn-primary">🚀 Generate Report</button>
                </div>
            </div>
            <div id="generateStatus" style="margin-top: 15px; display: none;"></div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="searchReports" placeholder="🔍 Search reports..." autocomplete="off">
            </div>
            <div>
                <button id="refreshReports" class="btn-sm btn-outline">🔄 Refresh</button>
            </div>
        </div>

        <!-- Reports List -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 20px; border-bottom: 1px solid #ecf0f1;">
                <h3 style="margin: 0;">📑 Your Generated Reports</h3>
            </div>
            <div id="reportsList" style="padding: 20px;">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading your reports...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Check authentication
        if (!api.token) {
            window.location.href = 'login.html';
        }

        let allReports = [];

        // Load reports history
        async function loadReports() {
            const reportsContainer = document.getElementById('reportsList');
            reportsContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading your reports...</p></div>';
            
            try {
                const reports = await api.getReportHistory();
                allReports = reports;
                displayReports(reports);
            } catch (error) {
                console.error('Error loading reports:', error);
                reportsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No Reports Found</h3>
                        <p>Generate your first ESG report using the form above.</p>
                    </div>
                `;
            }
        }

        // Display reports with search filter
        function displayReports(reports) {
            const reportsContainer = document.getElementById('reportsList');
            const searchTerm = document.getElementById('searchReports')?.value.toLowerCase() || '';
            
            let filteredReports = reports;
            if (searchTerm) {
                filteredReports = reports.filter(report => 
                    report.report_type.toLowerCase().includes(searchTerm) ||
                    new Date(report.created_at).toLocaleDateString().includes(searchTerm)
                );
            }
            
            if (!filteredReports || filteredReports.length === 0) {
                reportsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No Reports Found</h3>
                        <p>${searchTerm ? 'No matching reports. Try a different search term.' : 'Generate your first ESG report using the form above.'}</p>
                    </div>
                `;
                return;
            }
            
            reportsContainer.innerHTML = filteredReports.map(report => `
                <div class="report-card" data-report-id="${report.id}">
                    <div class="report-header">
                        <div>
                            <div class="report-title">
                                ${getReportTypeIcon(report.report_type)} ${getReportTypeName(report.report_type)} Report
                            </div>
                            <div class="report-date">
                                Generated: ${new Date(report.created_at).toLocaleString()}
                            </div>
                        </div>
                        <div class="report-actions">
                            <button onclick="downloadReport(${report.id})" class="btn-sm btn-primary">📥 Download PDF</button>
                            <button onclick="previewReport(${report.id})" class="btn-sm btn-outline">👁️ Preview</button>
                            <button onclick="shareReport(${report.id})" class="btn-sm btn-outline">📤 Share</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getReportTypeIcon(type) {
            const icons = {
                'basic': '📋',
                'advanced': '⭐',
                'sector': '🏭'
            };
            return icons[type] || '📄';
        }

        function getReportTypeName(type) {
            const names = {
                'basic': 'Basic ESG',
                'advanced': 'Advanced ESG',
                'sector': 'Sector-Specific'
            };
            return names[type] || type;
        }

        // Generate new report
        async function generateReport() {
            const year = document.getElementById('reportYear').value;
            const type = document.getElementById('reportType').value;
            const statusDiv = document.getElementById('generateStatus');
            
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; display: inline-block; margin-right: 10px;"></div> Generating report...';
            statusDiv.style.color = '#2ecc71';
            
            const generateBtn = document.getElementById('generateReportBtn');
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ Generating...';
            
            try {
                const result = await api.generateReport(year, type);
                statusDiv.innerHTML = '✅ Report generated successfully! Downloading...';
                
                // Refresh the reports list
                await loadReports();
                
                // Auto-download if available
                if (result.filename) {
                    setTimeout(() => {
                        window.open(`${API_BASE}${result.download_url}`, '_blank');
                    }, 500);
                }
                
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
                
            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.style.color = '#e74c3c';
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 4000);
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = '🚀 Generate Report';
            }
        }

        // Download report
        async function downloadReport(reportId) {
            try {
                const response = await fetch(`${API_BASE}/reports/download/${reportId}`, {
                    headers: {
                        'Authorization': `Bearer ${api.token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Download failed');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `esg_report_${reportId}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                showToast('Report downloaded successfully!', 'success');
            } catch (error) {
                showToast('Error downloading report: ' + error.message, 'error');
            }
        }

        // Preview report
        async function previewReport(reportId) {
            try {
                const response = await fetch(`${API_BASE}/reports/download/${reportId}`, {
                    headers: {
                        'Authorization': `Bearer ${api.token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Preview failed');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                window.open(url, '_blank');
                window.URL.revokeObjectURL(url);
            } catch (error) {
                showToast('Error previewing report: ' + error.message, 'error');
            }
        }

        // Share report
        async function shareReport(reportId) {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'ESG Report',
                        text: 'Check out my company\'s ESG report',
                        url: `${window.location.origin}/reports.html?id=${reportId}`
                    });
                    showToast('Shared successfully!', 'success');
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        showToast('Error sharing: ' + error.message, 'error');
                    }
                }
            } else {
                // Fallback: copy to clipboard
                const shareUrl = `${window.location.origin}/reports.html?id=${reportId}`;
                navigator.clipboard.writeText(shareUrl);
                showToast('Report link copied to clipboard!', 'success');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = type === 'error' ? '#e74c3c' : '#2ecc71';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Search functionality
        document.getElementById('searchReports')?.addEventListener('input', (e) => {
            displayReports(allReports);
        });

        document.getElementById('refreshReports')?.addEventListener('click', () => {
            loadReports();
        });

        // Logout handler
        document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            api.logout();
        });

        // Generate button click
        document.getElementById('generateReportBtn')?.addEventListener('click', generateReport);

        // Set default year to current
        const currentYear = new Date().getFullYear();
        document.getElementById('reportYear').value = currentYear;

        // Load reports on page load
        loadReports();
    </script>
</body>
</html>
