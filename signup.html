<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sign Up - ESG Qatar SME Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-container {
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.85rem;
        }

        label i {
            margin-right: 0.5rem;
            color: #2ecc71;
        }

        input, select {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
        }

        .password-hint {
            font-size: 0.75rem;
            color: #95a5a6;
            margin-top: 0.25rem;
        }

        .btn {
            padding: 0.875rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Verification Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 450px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-icon {
            font-size: 4rem;
            color: #2ecc71;
            margin-bottom: 1rem;
        }

        .modal h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .modal p {
            color: #7f8c8d;
            margin-bottom: 1.5rem;
        }

        .verification-inputs {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .verification-inputs input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0;
        }

        .timer {
            color: #e74c3c;
            font-weight: 600;
            margin: 1rem 0;
        }

        .resend-btn {
            background: none;
            border: none;
            color: #2ecc71;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .resend-btn:disabled {
            color: #bdc3c7;
            cursor: not-allowed;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #2ecc71;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            z-index: 11000;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .toast.error {
            background: #e74c3c;
        }

        .toast.info {
            background: #3498db;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .card {
                padding: 1.5rem;
            }
            
            .verification-inputs input {
                width: 45px;
                height: 55px;
                font-size: 1.25rem;
            }
            
            .toast {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <div class="auth-header">
                <h1><i class="fas fa-leaf"></i> ESG Qatar SME</h1>
                <p>Create your account and verify your email</p>
            </div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label><i class="fas fa-building"></i> Company Name *</label>
                    <input type="text" id="companyName" required placeholder="Enter your company name">
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address *</label>
                    <input type="email" id="email" required placeholder="company@example.com">
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-industry"></i> Business Sector *</label>
                    <select id="sector" required>
                        <option value="">Select your sector</option>
                        <option value="Agriculture">🌾 Agriculture</option>
                        <option value="E-Commerce">🛒 E-Commerce</option>
                        <option value="Education">📚 Education</option>
                        <option value="Fintech">💳 Fintech</option>
                        <option value="Healthcare">🏥 Healthcare</option>
                        <option value="Industrial Manufacturing">🏭 Industrial Manufacturing</option>
                        <option value="Other">📌 Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-users"></i> Number of Employees</label>
                    <input type="number" id="numEmployees" value="0" placeholder="0">
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password * (min 8 characters)</label>
                    <input type="password" id="password" required minlength="8" placeholder="••••••••">
                    <div class="password-hint">
                        <i class="fas fa-info-circle"></i> Must contain at least 8 characters, 1 number, 1 uppercase letter
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="signupBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
            
            <p style="text-align: center; margin-top: 1.5rem; color: #7f8c8d;">
                Already have an account? <a href="login.html" style="color: #2ecc71; text-decoration: none; font-weight: 600;">Login here</a>
            </p>
        </div>
    </div>

    <!-- Verification Modal -->
    <div id="verificationModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-envelope-open-text"></i>
            </div>
            <h3>Verify Your Email</h3>
            <p>We've sent a verification code to <strong id="verifyEmail"></strong></p>
            <p style="font-size: 0.85rem;">Please enter the 6-digit code below to activate your account</p>
            
            <div class="verification-inputs">
                <input type="text" maxlength="1" class="code-input" data-index="0" autofocus>
                <input type="text" maxlength="1" class="code-input" data-index="1">
                <input type="text" maxlength="1" class="code-input" data-index="2">
                <input type="text" maxlength="1" class="code-input" data-index="3">
                <input type="text" maxlength="1" class="code-input" data-index="4">
                <input type="text" maxlength="1" class="code-input" data-index="5">
            </div>
            
            <div class="timer" id="timer">Resend code in 60s</div>
            <button id="resendBtn" class="resend-btn" disabled>
                <i class="fas fa-redo-alt"></i> Resend Verification Code
            </button>
            <button id="verifyBtn" class="btn btn-primary" style="margin-top: 1rem;">
                <i class="fas fa-check-circle"></i> Verify & Activate
            </button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Check if already logged in
        if (api.token) {
            window.location.href = 'dashboard.html';
        }

        let pendingUserData = null;
        let verificationCode = null;
        let timerInterval = null;
        let timeLeft = 60;

        // Show toast notification
        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : type === 'info' ? 'info' : ''}`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        // Validate password strength
        function validatePassword(password) {
            if (password.length < 8) {
                return { valid: false, message: 'Password must be at least 8 characters' };
            }
            if (!/\d/.test(password)) {
                return { valid: false, message: 'Password must contain at least one number' };
            }
            if (!/[A-Z]/.test(password)) {
                return { valid: false, message: 'Password must contain at least one uppercase letter' };
            }
            return { valid: true, message: '' };
        }

        // Send verification code to email
        async function sendVerificationCode(email) {
            try {
                const response = await fetch(`${API_BASE}/auth/send-verification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to send verification code');
                }
                
                verificationCode = data.code;
                showToast(`Verification code sent to ${email}`, 'success');
                return true;
            } catch (error) {
                console.error('Error sending code:', error);
                showToast(error.message, 'error');
                return false;
            }
        }

        // Start timer for resend button
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const resendBtn = document.getElementById('resendBtn');
            timeLeft = 60;
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerElement.textContent = '✓ You can request a new code now';
                    timerElement.style.color = '#2ecc71';
                    resendBtn.disabled = false;
                } else {
                    timerElement.textContent = `Resend code in ${timeLeft}s`;
                    timerElement.style.color = '#e74c3c';
                    resendBtn.disabled = true;
                }
                timeLeft--;
            }, 1000);
        }

        // Handle verification code input
        function setupVerificationInputs() {
            const inputs = document.querySelectorAll('.code-input');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < 5) {
                        inputs[index + 1].focus();
                    }
                });
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }

        // Get entered verification code
        function getEnteredCode() {
            const inputs = document.querySelectorAll('.code-input');
            let code = '';
            inputs.forEach(input => {
                code += input.value;
            });
            return code;
        }

        // Verify the code
        async function verifyCode() {
            const enteredCode = getEnteredCode();
            
            if (enteredCode.length !== 6) {
                showToast('Please enter the 6-digit verification code', 'error');
                return;
            }
            
            if (enteredCode !== verificationCode) {
                showToast('Invalid verification code. Please try again.', 'error');
                return;
            }
            
            // Code is correct, complete signup
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verifying...';
            
            try {
                // Complete the signup with verification
                const response = await fetch(`${API_BASE}/auth/complete-signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ...pendingUserData,
                        verified: true
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Verification failed');
                }
                
                showToast('Account verified successfully! Please login.', 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                showToast(error.message, 'error');
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Activate';
            }
        }

        // Resend verification code
        async function resendCode() {
            if (!pendingUserData) return;
            
            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;
            resendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
            
            const success = await sendVerificationCode(pendingUserData.email);
            
            if (success) {
                startTimer();
                // Clear input fields
                document.querySelectorAll('.code-input').forEach(input => input.value = '');
                document.querySelector('.code-input').focus();
            }
            
            resendBtn.innerHTML = '<i class="fas fa-redo-alt"></i> Resend Verification Code';
        }

        // Signup form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const companyName = document.getElementById('companyName').value;
            const sector = document.getElementById('sector').value;
            const numEmployees = parseInt(document.getElementById('numEmployees').value) || 0;
            
            // Validate email
            if (!email || !email.includes('@')) {
                showToast('Please enter a valid email address', 'error');
                return;
            }
            
            // Validate password
            const passwordValidation = validatePassword(password);
            if (!passwordValidation.valid) {
                showToast(passwordValidation.message, 'error');
                return;
            }
            
            // Validate company name
            if (!companyName) {
                showToast('Please enter your company name', 'error');
                return;
            }
            
            // Validate sector
            if (!sector) {
                showToast('Please select your business sector', 'error');
                return;
            }
            
            const signupBtn = document.getElementById('signupBtn');
            signupBtn.disabled = true;
            signupBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Creating account...';
            
            try {
                // First, check if email is available and send verification code
                const checkResponse = await fetch(`${API_BASE}/auth/check-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const checkData = await checkResponse.json();
                
                if (!checkResponse.ok) {
                    throw new Error(checkData.detail || 'Email already registered');
                }
                
                // Store user data temporarily
                pendingUserData = {
                    email,
                    password,
                    company_name: companyName,
                    sector,
                    num_employees: numEmployees
                };
                
                // Send verification code
                const codeSent = await sendVerificationCode(email);
                
                if (!codeSent) {
                    throw new Error('Failed to send verification code');
                }
                
                // Show verification modal
                document.getElementById('verifyEmail').textContent = email;
                document.getElementById('verificationModal').classList.add('active');
                setupVerificationInputs();
                startTimer();
                
                // Clear form
                document.getElementById('signupForm').reset();
                
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });
        
        // Verification button click
        document.getElementById('verifyBtn').addEventListener('click', verifyCode);
        
        // Resend button click
        document.getElementById('resendBtn').addEventListener('click', resendCode);
        
        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('verificationModal');
                modal.classList.remove('active');
            }
        });
        
        // Auto-focus next input on paste
        document.querySelectorAll('.code-input').forEach(input => {
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData('text');
                if (paste.length === 6 && /^\d+$/.test(paste)) {
                    const inputs = document.querySelectorAll('.code-input');
                    paste.split('').forEach((char, index) => {
                        if (inputs[index]) inputs[index].value = char;
                    });
                    verifyCode();
                }
            });
        });
    </script>
</body>
</html>
